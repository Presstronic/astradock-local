name: Blueprint Exporter pre-alpha release

on:
  push:
    tags:
      - 'v*.*.*-*'

permissions:
  contents: write

env:
  NODE_VERSION: 22.14.0

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_command: npm run dist:standalone:exporter:win
            asset_paths: dist/standalone-exporter/*.exe
          - os: ubuntu-latest
            build_command: npm run dist:standalone:exporter:linux
            asset_paths: dist/standalone-exporter-linux/*.AppImage

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set package version from release tag
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build Blueprint Exporter package
        run: ${{ matrix.build_command }}

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: blueprint-exporter-${{ matrix.os }}
          path: ${{ matrix.asset_paths }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub pre-release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "AstraDock Local ${GITHUB_REF_NAME#v} — Blueprint Exporter" \
            --prerelease \
            --generate-notes
